version: '3.8'

services:
  rtsp-streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_rtsp_streamer
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => {if (r.statusCode !== 200) process.exit(1);})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
